apiVersion: batch/v1
kind: CronJob
metadata:
 name: call-api-cronjob
 namespace: mateapp
spec:
 schedule: "*/4 * * * *"
 concurrencyPolicy: Allow
 startingDeadlineSeconds: 100
 successfulJobsHistoryLimit: 10
 failedJobsHistoryLimit: 5
 jobTemplate:
   spec:
     template:
       spec:
         containers:
         - name: call-api
           image: busyboxplus:curl
           command:
             - "/bin/sh"
             - "-c"
             - "curl -v http://todoapp-service.mateapp.svc.cluster.local:80/api/health"
           resources:
             requests:
               cpu: "100m"
               memory: "100Mi"
             limits:
               cpu: "200m"
               memory: "200Mi"
         restartPolicy: OnFailure
